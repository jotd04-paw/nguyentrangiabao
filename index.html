<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giới thiệu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b, #132a2e);
      color: #f8fafc;
    }

    .profile-card {
      width: 100%;
      max-width: 420px;
      padding: 28px 24px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .bio {
      font-size: 15px;
      line-height: 1.5;
      color: #cbd5e1;
      margin-bottom: 22px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: block;
      padding: 12px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      color: #f8fafc;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.2);
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.14);
    }
  </style>
</head>
<body>
  <main class="profile-card">
    <p class="bio">Xin chào, mình là Gia Bảo.</p>

    <nav class="links">
      <a class="link-btn" href="<a class="link-btn" href="https://mail.google.com/mail/?view=cm&fs=1&to=baonguyen93858@gmail.com" target="_blank" rel="noopener noreferrer">Gửi email</a>
      <a class="link-btn" href="https://www.facebook.com/share/19mzdj3PyG/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer">Facebook</a>
      <a class="link-btn" href="https://www.instagram.com/jia_04.paw?cplk=MXhuOWZjZmdzb2VkYQ%3D%3D&amp;utm_source=qr" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a class="link-btn" href="https://youtube.com/@ntgb._04?si=yqtD-nScil-y4BCB" target="_blank" rel="noopener noreferrer">YouTube</a>
    </nav>
  </main>
</body>
</html>
