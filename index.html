<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giới thiệu — Gia Bảo</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b, #132a2e);
      color: #f8fafc;
      -webkit-font-smoothing: antialiased;
    }

    .profile-card {
      width: 100%;
      max-width: 400px;
      padding: 28px 22px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.38);
      text-align: center;
    }

    .bio {
      font-size: 15.5px;
      line-height: 1.55;
      color: #e2e8f0;
      margin-bottom: 22px;
      font-weight: 500;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 12px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 14.5px;
      font-weight: 600;
      color: #f8fafc;
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.2);
      transition: transform 0.18s ease, border-color 0.18s ease, background-color 0.18s ease;
    }

    .link-btn:hover,
    .link-btn:focus-visible {
      transform: translateY(-2px);
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.14);
      outline: none;
    }

    .link-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <main class="profile-card">
    <p class="bio">Xin chào, mình là Gia Bảo.</p>

    <nav class="links" aria-label="Liên kết mạng xã hội và liên hệ">
      <a class="link-btn" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=baonguyen93858@gmail.com" target="_blank" rel="noopener noreferrer">Gửi email</a>
      <a class="link-btn" href="https://www.facebook.com/share/19mzdj3PyG/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer">Facebook</a>
      <a class="link-btn" href="https://www.instagram.com/jia_04.paw?cplk=MXhuOWZjZmdzb2VkYQ%3D%3D&amp;utm_source=qr" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a class="link-btn" href="https://youtube.com/@ntgb._04?si=yqtD-nScil-y4BCB" target="_blank" rel="noopener noreferrer">YouTube</a>
    </nav>
  </main>
</body>
</html>
